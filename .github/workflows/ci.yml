name: CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  backend-validation:
    name: Модульные тесты и сборка Docker
    runs-on: ubuntu-latest

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Настройка Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установка зависимостей Python
        run: |
          python -m pip install --upgrade pip
          pip install pytest httpx fastapi uvicorn bcrypt pyjwt pydantic

      - name: Запуск модульных тестов бэкенда (Pytest)
        run: python -m pytest test_main.py

      - name: Сборка Docker контейнера
        run: docker build -t holidaycalendar-backend .


